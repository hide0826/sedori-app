<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HIRIO ルート一覧</title>
  <link rel="icon" href="/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ルート巡回" />
  <meta name="theme-color" content="#2a9fe0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --border: #2a3548;
      --ok: #2ea043;
      --net: #c9842f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 14px;
      padding-bottom: 40px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 6px; }
    h2 {
      font-size: 1rem;
      margin: 18px 0 8px;
      color: var(--text);
    }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
    .hint {
      background: #132033;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .hint code {
      color: #9ecbff;
      word-break: break-all;
    }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button.secondary { background: #3a4558; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    a.card.net {
      border-color: #6b4a1e;
    }
    a.card:active { opacity: 0.9; }
    a.card.disabled { opacity: 0.45; pointer-events: none; }
    .date { font-size: 1.05rem; font-weight: 700; }
    .name { margin-top: 4px; font-size: 1rem; }
    .meta { margin-top: 6px; color: var(--muted); font-size: 0.8rem; }
    .badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #243247;
      color: var(--muted);
    }
    .badge.ok { background: #1f3d2a; color: #3fb950; }
    .badge.net { background: #3d2a12; color: #f0b35a; }
    #status { margin-top: 10px; color: var(--muted); font-size: 0.85rem; min-height: 1.2em; }
    #status.err { color: #ff7b72; }
  </style>
</head>
<body>
  <h1>HIRIO 撮影・巡回</h1>
  <div class="sub">このページをスマホのホーム／ブックマークに固定してください</div>
  <div class="hint">
    連続撮影は <code>https://houseserver.tail0a340c.ts.net/</code>（Tailscale ON）で開いてください。<br /><br />
    <b>ネット仕入の撮影準備は PC の「DB保存」で自動です。</b><br />
    PC → 仕入管理 → <b>ネット仕入</b> → CSV取込 → DB保存<br />
    その後、下の「ネット仕入」の箱をタップして撮ります。
  </div>
  <div class="toolbar">
    <button type="button" id="reloadBtn">再読込</button>
  </div>

  <h2>検品ツール</h2>
  <a class="card" href="/tws/">
    <div class="date">TWS バッテリー検品</div>
    <div class="name">1時間放電テスト・判定・Amazon出品文</div>
    <div class="meta">ホーム画面に追加してアプリ感覚で使えます</div>
    <span class="badge ok">検品へ</span>
  </a>

  <h2>ネット仕入（商品撮影）</h2>
  <div id="netList"></div>

  <h2>ルート（時刻・レシート）</h2>
  <div id="routeList"></div>

  <div id="status"></div>

  <script>
    function setStatus(msg, kind) {
      const el = document.getElementById("status");
      el.textContent = msg || "";
      el.className = kind || "";
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function isOnline(r) {
      return String(r.box_kind || "").toLowerCase() === "online"
        || String(r.route_code || "").toUpperCase() === "NET";
    }

    function makeCard(r, online) {
      const a = document.createElement("a");
      a.className = "card" + (online ? " net" : "") + (r.available ? "" : " disabled");
      if (r.available) {
        a.href = online
          ? "/route/" + encodeURIComponent(r.web_id) + "/photos"
          : "/route/" + encodeURIComponent(r.web_id);
      } else {
        a.href = "#";
      }
      const badgeText = !r.available
        ? "ファイルなし"
        : (online ? "商品撮影へ" : "時刻入力へ");
      const badgeClass = !r.available ? "badge" : (online ? "badge net" : "badge ok");
      a.innerHTML =
        '<div class="date">' + escapeHtml(r.route_date || "(日付なし)") + "</div>" +
        '<div class="name">' + escapeHtml(r.route_name || r.web_id) + "</div>" +
        '<div class="meta">' +
        escapeHtml(online ? "ネット仕入" : (r.route_code || "")) +
        (r.updated_at ? " · 更新 " + escapeHtml(r.updated_at) : "") +
        "</div>" +
        '<span class="' + badgeClass + '">' + badgeText + "</span>";
      return a;
    }

    async function loadList() {
      setStatus("読み込み中…");
      const res = await fetch("/api/routes");
      if (!res.ok) {
        setStatus("読み込み失敗: " + res.status, "err");
        return;
      }
      const data = await res.json();
      const routes = data.routes || [];
      const netWrap = document.getElementById("netList");
      const routeWrap = document.getElementById("routeList");
      netWrap.innerHTML = "";
      routeWrap.innerHTML = "";

      const net = routes.filter(isOnline);
      const store = routes.filter((r) => !isOnline(r));

      if (!net.length) {
        netWrap.innerHTML =
          '<div class="hint">まだネット箱がありません。<br>' +
          "PCのHIRIOで「仕入管理 → ネット仕入 → CSV取込 → DB保存」すると、ここに出ます。</div>";
      } else {
        net.forEach((r) => netWrap.appendChild(makeCard(r, true)));
      }

      if (!store.length) {
        routeWrap.innerHTML =
          '<div class="hint">ルートがありません。PCで「Webテンプレート作成」を押してください。</div>';
      } else {
        store.forEach((r) => routeWrap.appendChild(makeCard(r, false)));
      }

      setStatus("ネット " + net.length + " 件 / ルート " + store.length + " 件");
    }

    document.getElementById("reloadBtn").addEventListener("click", () => loadList());
    loadList();
  </script>
</body>
</html>
